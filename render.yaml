services:
  - type: web
    name: secure-login-portal-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: techfest_super_secure_jwt_secret_key_2026_xyz
      - key: CLIENT_ORIGIN
        value: "*"
